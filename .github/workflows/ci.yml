name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: soonic_test
          MARIADB_USER: app
          MARIADB_PASSWORD: "!ChangeMe!"
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: ctype, iconv, pdo, pdo_mysql

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install JS dependencies
        run: npm ci

      - name: Run checks (CI mode)
        run: bin/check --ci

      - name: Run PHPUnit suites
        env:
          DATABASE_URL: "mysql://app:!ChangeMe!@127.0.0.1:3306/soonic_test?serverVersion=10.11.2-MariaDB&charset=utf8mb4"
        run: |
          php bin/phpunit --testsuite no-music
          php bin/phpunit --testsuite with-music
          php bin/phpunit --testsuite scan
